# fly.toml app configuration file generated for movies-sg-api on 2026-08-08T09:56:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'movies-sg-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
